[project]
name = "finledger"
version = "0.1.0"
description = "A local financial ledger and self-contained portfolio dashboard"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = ["yfinance==1.7.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    # yfinance noise — when offline tests stub the module out, suppress
    # the rest.
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
# Treat warnings as errors during CI to catch regressions early — comment
# this back in when the codebase is warning-clean.
# filterwarnings = ["error"]
