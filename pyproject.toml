[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    # yfinance noise — when offline tests stub the module out, suppress
    # the rest.
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
# Treat warnings as errors during CI to catch regressions early — comment
# this back in when the codebase is warning-clean.
# filterwarnings = ["error"]
