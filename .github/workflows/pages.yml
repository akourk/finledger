name: pages

# Publishes the SAMPLE dashboard to GitHub Pages so the project can be
# looked at without cloning and running anything.
#
# This can only ever build the fictional portfolio.  `data/` is gitignored,
# so a fresh checkout has nothing in it but `.gitkeep`; the only input is
# `samples/portfolio.snapshot.json` plus the checked-in price cache. The
# guard step below asserts that rather than assuming it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; don't cancel one that's mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yfinance is the only runtime dependency.  Prices for the sample's
      # symbols are already in the committed cache, so a rate-limited or
      # failed fetch degrades to the cached/transaction price rather than
      # breaking the build.
      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance

      - name: Refuse to build if real data is present
        run: |
          found=$(find data -type f ! -name '.gitkeep' | head -5)
          if [ -n "$found" ]; then
            echo "::error::data/ is not empty — refusing to publish a dashboard"
            echo "$found"
            exit 1
          fi
          echo "data/ is clean; building from samples/ only"

      - name: Build the sample dashboard
        run: |
          python -m src.main --import-snapshot samples/portfolio.snapshot.json
          python -m src.main

      - name: Stage the site
        run: |
          mkdir -p _site
          cp exports/dashboard.html _site/index.html
          ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
