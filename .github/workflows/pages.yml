name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/tests.yml

  stage:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      # This is the same artifact that passed privacy, Python, browser,
      # accessibility and reproducibility checks for this exact commit.
      - uses: actions/download-artifact@v4
        with:
          name: verified-demo
          path: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
