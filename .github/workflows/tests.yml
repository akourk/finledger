name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Report BOTH legs.  With the default fail-fast, the first failure
      # cancels the other job — so a 3.10-only failure hid a separate
      # 3.12-only one, and fixing the first just revealed the second a
      # push later.  Two failures found in one run beats two round trips.
      fail-fast: false
      matrix:
        # 3.10 backs the README's "Python 3.10+" claim; 3.12 covers current.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The app has no runtime dependency beyond yfinance, and yfinance is
      # imported lazily inside functions that the test suite stubs out — so
      # the tests run fully offline.  We install yfinance anyway as cheap
      # insurance against any lazy-import path a test might reach.
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest yfinance

      # tests/test_dashboard_consistency.py renders the real dashboard
      # bundle under node and asserts relations between the figures it
      # displays.  Without node those tests SKIP, which reads as green —
      # so node is installed explicitly rather than left to whatever the
      # runner image happens to ship.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # conftest.py sets FIN_ASSERT_INVARIANTS=1, so the high-severity
      # data-health checks are promoted to hard errors during the run.
      # `-rs` prints a reason line for every skip, so a suite that stops
      # running is visible in the log instead of reading as green.
      - name: Run tests
        run: python -m pytest tests/ -q -rs
