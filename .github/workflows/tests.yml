name: tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.10.9
          uv sync --frozen --all-groups
      - name: Check tracked public files
        run: uv run --frozen python -m tools.privacy_guard scan --scope tracked
      - name: Run Python and cross-language regressions
        run: uv run --frozen python -m pytest tests/ -q -rs

  demo:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked validation dependencies
        run: |
          python -m pip install uv==0.10.9
          uv sync --frozen --all-groups
          npm ci --no-audit --no-fund
      - name: Build exclusively from generated fictional inputs
        run: uv run --frozen python -m tools.build_demo
      - name: Check the exact public artifact for private data
        run: uv run --frozen python -m tools.privacy_guard scan --artifact _site
      - name: Validate ordinary browser interactions
        run: npm run test:browser
      - name: Validate accessibility of the final bannered page
        run: npm run test:a11y
      - name: Verify reproducibility
        run: |
          uv run --frozen python -m tools.build_demo --output /tmp/finledger-repeat
          diff _site/index.html /tmp/finledger-repeat/index.html
          diff _site/provenance.json /tmp/finledger-repeat/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-demo
          path: _site
          if-no-files-found: error
          retention-days: 7
