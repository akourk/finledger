name: accessibility

# Builds the dashboard from the synthetic sample portfolio and runs
# axe-core against the rendered page in a real browser.  Fails on any
# violation at `serious` or `critical` severity.
#
# Why a browser rather than a parser: the dashboard's entire body is
# built by JavaScript at view time, and the two things most worth
# checking — computed colour contrast, and whether the tab state stays
# in sync as you click — do not exist in the file.  The static half of
# the guarantee (attributes present in the bundle) is pinned by
# tests/test_accessibility.py, which runs in the `tests` workflow.

on:
  push:
  pull_request:

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip yfinance
          npm install --no-audit --no-fund --no-save puppeteer @axe-core/puppeteer

      # Same guard the pages workflow carries.  data/ is gitignored, so a
      # fresh checkout has nothing in it — but the check is cheap and the
      # failure mode (scanning, and logging selectors from, somebody's
      # real portfolio) is not.
      - name: Refuse to build if real data is present
        run: |
          found=$(find data -type f ! -name '.gitkeep' | head -5)
          if [ -n "$found" ]; then
            echo "::error::data/ is not empty — refusing to build a dashboard"
            exit 1
          fi

      - name: Build the sample dashboard
        run: |
          python -m src.main --import-snapshot samples/portfolio.snapshot.json
          python -m src.main

      - name: axe-core
        run: node tools/a11y_check.js exports/dashboard.html
